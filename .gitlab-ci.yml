stages:
  - publish

variables:
  NODE_IMAGE: node:20

publish:
  stage: publish
  image: $NODE_IMAGE

  rules:
    # ✅ run when version tags are pushed
    - if: $CI_COMMIT_TAG

    # ✅ OR run on main branch (optional)
    - if: $CI_COMMIT_BRANCH == "main"

  before_script:
    # install dependencies
    - npm ci

    # authenticate to GitLab registry
    - echo "@dwp:registry=https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/packages/npm/" > .npmrc
    - echo "//gitlab.com/api/v4/projects/$CI_PROJECT_ID/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc

  script:
    - npm publish --registry https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/packages/npm/

  only:
    - tags
    - main
